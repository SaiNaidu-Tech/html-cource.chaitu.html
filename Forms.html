<html>
    <body>
        <h1>Registration Form</h1>

        <h1 style="color: red;">Text Boxes</h1>
            Username: <input type="text" name="username" maxlength="20" size="20"><br>
            Password: <input type="password" name="password" maxlength="20" size="20"><br>

        <h1 style="color: red;">Radio Buttons</h1>
        <h2>Gender</h2>
            <input type="radio" name="gender" value="male"> Male<br>
            <input type="radio" name="gender" value="female"> Female<br>

        <h1 style="color: red;">Check Boxes</h1>
        <h2>Hobbies</h2>
            <input type="checkbox" name="hobby" value="reading"> Reading<br>
            <input type="checkbox" name="hobby" value="swimming"> Swimming<br>
            <input type="checkbox" name="hobby" value="coding"> Coding<br>
            <input type="checkbox" name="hobby" value="traveling"> Traveling<br>

        <h1 style="color: red;">Select</h1>
        <h2>Course</h2>
        <select name="course">
            <option value="AI">Artificial Intelligence</option>
            <option value="CSE">Computer Science & Engineering</option>
            <option value="AI-ML">Artificial Intelligence & Machine Learning</option>
            <option value="DS">Data Science</option>
        </select><br>

        <h1 style="color: red;">File Upload</h1>
        <input type="file" name="Resume"><br>

        <h1 style="color: red;">Text Area</h1>
        <h2>Address</h2>
        <textarea name="bio" rows="5" cols="50"></textarea><br>

        <h1 style="color: red;">Buttons</h1>

        <input type="submit" value="Submit">
        <input type="button" value="Click Me" onclick="alert('Button Clicked!')"><br>
        <input type="reset" value="Reset"><br>
        <input type="image" name="Img button" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ62mZn-g_FDVhNAYwqwPoESQG3SPPdwb3tqGphpeBmbQ&s=10" alt="Submit" width="100" height="100">
            
    </body>
</html>
