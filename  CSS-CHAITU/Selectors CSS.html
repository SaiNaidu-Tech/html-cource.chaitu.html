<html>
    <head>
        <style>
            h1 {
                color:red;
                background-color: yellow;
            }
            #Namaste {
                color:blue;
                background-color: green;
            }
            .Vanakkam {
                color:green;
                background-color:grey;
            }
            * {
                color:red;
                background-color: black;
            }
            h3,h4 {
                color:blue;
                background-color: pink;
            }
        </style>
    </head>
    <body>
        <h1> Welcome to Selectors in CSS <br> @ Name Based</h1>

        <h1 id="Namaste"> @ ID Based</h1>

        <h1 class="Vanakkam"> @ Class Based</h1>

        <h2>Universal Selector</h2>

        <h3> Grouping</h3>

        <h4>Selectors</h4>
    </body>
</html>
